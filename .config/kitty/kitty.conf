include hyde.conf

# Hyprland can report a stale/bogus initial "maximized" state to newly
# launched windows; kitty's remember_window_size (default yes) honors it,
# which is why kitty was launching fullscreen instead of tiled.
# See https://github.com/kovidgoyal/kitty/issues/10442
remember_window_size no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

font_family Maple Mono
font_size 8.5
