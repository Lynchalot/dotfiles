# rice-extras: which HyDE themes get the NERV extras (lock screen, Japanese tags, volume
# pop-up, UI sounds). Applied on theme switch; every theme not listed gets them switched off.
# Theme names must match ~/.config/hyde/themes/<name>.
Asuka NERV = nerv

# lock screen layouts (names of files in ~/.config/hypr/hyprlock/)
nerv_lock = NERV
default_lock = Asuka
