<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM '/etc/fonts/conf.d/fonts.dtd'>
<fontconfig>
 <alias binding="same">
  <family>Lexend</family>
  <prefer>
   <family>Readex Pro</family>
  </prefer>
 </alias>
 <!-- Japanese/Chinese fallback: gothic (Sarasa, Noto Sans CJK) instead of the AR PL serif fonts.
      Noto Sans stays first, so Latin text is unchanged. -->
 <alias binding="strong">
  <family>sans-serif</family>
  <prefer>
   <family>Noto Sans</family>
   <family>Sarasa UI J</family>
   <family>Noto Sans CJK JP</family>
  </prefer>
 </alias>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>false</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintnone</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
