#  NERV — Asuka layout plus a light HUD: glitching clock, corner brackets, now playing,
#  waiting notifications and a Caps Lock warning. Helpers: ~/.local/bin/lock-glitch, lock-info.

$fontFamily = Nunito
$hudFont = Maple Mono
$nervRed = rgba(226, 69, 44, 0.85)
$nervOrange = rgba(255, 154, 74, 0.6)
$resolve.font=IBM Plex Sans|https://github.com/IBM/plex/releases/download/%40ibm%2Fplex-sans%401.1.0/ibm-plex-sans.zip

# GENERAL
general {
    ignore_empty_input = true
}

# Entrance: a quick fade in (0.3 s) on the Rice curve; the password field grows and recolours
# smoothly. hyprlock animates the whole screen, not individual labels.
animations {
    enabled = true
    bezier = nervOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, nervOut
    animation = fadeOut, 1, 2, nervOut
    animation = inputFieldWidth, 1, 3, nervOut
    animation = inputFieldColors, 1, 3, nervOut
    animation = inputFieldDots, 1, 2, nervOut
}
background {
    monitor =
    path = $BACKGROUND_PATH
    blur_size = 6
    blur_passes = 2   # Asuka-style blur, a touch stronger (Asuka: size 5)
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.6000   # darker than Asuka (0.80) so the clock and quote read well
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
    # HyDE's base hyprlock.conf adds a 95%-opaque wallbash colour background that hyprlock
    # draws over this one (the "blue filter"); lift the wallpaper above it.
    zindex = 0
}

# Weather (top center)
label {
    monitor =
    text = cmd[update:1800000] $WEATHER_CMD
    color = $wallbash_2xa8_rgba
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}

# Clock ghost (H): the real digits in red, offset, shown only during a glitch
label {
    monitor =
    text = cmd[update:150] /home/Lynchalot/.local/bin/lock-glitch H ghost
    color = $nervRed
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 6, 77
    halign = center
    valign = center
}
# Clock ghost (M): the real digits in red, offset, shown only during a glitch
label {
    monitor =
    text = cmd[update:150] /home/Lynchalot/.local/bin/lock-glitch M ghost
    color = $nervRed
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 6, -123
    halign = center
    valign = center
}

# Current time (hour)
label {
    monitor =
    text = cmd[update:150] /home/Lynchalot/.local/bin/lock-glitch H
    color = $wallbash_2xa7_rgba
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 0, 80
    halign = center
    valign = center
}
# Current time (minute)
label {
    monitor =
    text = cmd[update:150] /home/Lynchalot/.local/bin/lock-glitch M
    color = $wallbash_2xa9_rgba
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 0, -120
    halign = center
    valign = center
}
# Date
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%d %b") </big></b>"
    color = $wallbash_2xa8_rgba
    font_size = 20
    font_family = $fontFamily Medium 10
    position = 0, -230
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}
# Day
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%A") </big></b>"
    color = $wallbash_2xa8_rgba
    font_size = 20
    font_family = $fontFamily Medium 10
    position = 0, -250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}

# Quote (bottom center, above input)
label {
    monitor =
    text = cmd[update:3600000] echo "<i>$(cat $HOME/.cache/splash/quote.txt 2>/dev/null)</i>"
    color = $wallbash_2xa8_rgba
    font_size = 16
    font_family = $fontFamily Italic
    position = 0, 18%
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.7)
    shadow_boost = 1.2
}

#INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 1.00
    dots_center = true
    outer_color = $wallbash_pry2_rgba
    inner_color = $wallbash_pry3_rgba
    font_color = $color7
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    capslock_color = rgba(255, 154, 74, 1.0)
    hide_input = false
    position = 0, 60
    halign = center
    valign = bottom
}

# Battery Status if present
label {
    monitor =
    text = cmd[update:5000] $BATTERY_ICON
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -1%, 1%
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}

# Current Keyboard Layout
label {
    monitor =
    text = $LAYOUT
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = $fontFamily
    position = -58, 37
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}

# ── NERV HUD: only real information ──
# Corner brackets: single glyphs, text level with them (as in the mockup)
label {
    monitor =
    text = ┏
    color = $nervOrange
    font_size = 24
    font_family = $hudFont
    position = 28, -28
    halign = left
    valign = top
}
label {
    monitor =
    text = ┓
    color = $nervOrange
    font_size = 24
    font_family = $hudFont
    position = -28, -28
    halign = right
    valign = top
}
label {
    monitor =
    text = ┗
    color = $nervOrange
    font_size = 24
    font_family = $hudFont
    position = 28, 28
    halign = left
    valign = bottom
}
label {
    monitor =
    text = ┛
    color = $nervOrange
    font_size = 24
    font_family = $hudFont
    position = -28, 28
    halign = right
    valign = bottom
}

# Now playing (top left): the player the media keys control; hidden when nothing plays
label {
    monitor =
    text = cmd[update:2000] /home/Lynchalot/.local/bin/lock-info np
    color = $wallbash_2xa8_rgba
    font_size = 13
    font_family = $hudFont
    position = 58, -43
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}

# Waiting notifications (top right); hidden when there are none
label {
    monitor =
    text = cmd[update:5000] /home/Lynchalot/.local/bin/lock-info notif
    color = $wallbash_2xa8_rgba
    font_size = 13
    font_family = $hudFont
    position = -58, -43
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}

# Caps Lock warning above the password field; only while Caps Lock is on
label {
    monitor =
    text = cmd[update:250] /home/Lynchalot/.local/bin/lock-info caps
    color = rgba(255, 154, 74, 1.0)
    font_size = 12
    font_family = $hudFont
    position = 0, 122
    halign = center
    valign = bottom
}
