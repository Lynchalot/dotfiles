#  NERV — the Asuka layout with a glitching clock (~/.local/bin/lock-glitch), a media player
#  (album art, title, ⏮ ⏯ ⏭ you can click), waiting notifications and a Caps Lock warning.
#  Media comes from lock-info (image reload_cmd polling), not HyDE's $MPRIS_TEXT/$SPLASH_CMD:
#  those start a hyprlock.sh scope every second and SIGUSR2 hyprlock, whose handler isn't signal-safe.
#  No animations block either. Every widget has zindex = 1: the wallpaper below needs zindex 0 to
#  sit above HyDE's colour background (-1), and hyprlock's widget sort is not stable, so widgets
#  tied with it at 0 were sometimes drawn UNDER it (lock showed only the blurred wallpaper).
#  Helpers: ~/.local/bin/lock-info, lock-glitch, rice-media.

$fontFamily = Nunito
$hudFont = Maple Mono
$nervRed = rgba(226, 69, 44, 0.85)
$resolve.font=IBM Plex Sans|https://github.com/IBM/plex/releases/download/%40ibm%2Fplex-sans%401.1.0/ibm-plex-sans.zip
# GENERAL
general {
    ignore_empty_input = true
}
background {
    monitor =
    path = $BACKGROUND_PATH
    blur_size = 6
    blur_passes = 2   # Asuka-style blur, a touch stronger (Asuka: size 5)
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.6000   # darker than Asuka (0.80) so the clock and quote read well
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
    # HyDE's base hyprlock.conf adds a 95%-opaque wallbash colour background that hyprlock
    # draws over this one (the "blue filter"); lift the wallpaper above it.
    zindex = 0
}

# Weather (top center)
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:1800000] $WEATHER_CMD
    color = $wallbash_2xa8_rgba
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}

# Clock ghost (H): the real digits in red, offset, shown only during a glitch
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:150] /home/Lynchalot/.local/bin/lock-glitch H ghost
    color = $nervRed
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 6, 77
    halign = center
    valign = center
}
# Clock ghost (M): the real digits in red, offset, shown only during a glitch
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:150] /home/Lynchalot/.local/bin/lock-glitch M ghost
    color = $nervRed
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 6, -123
    halign = center
    valign = center
}

# Current time (hour)
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:150] /home/Lynchalot/.local/bin/lock-glitch H
    color = $wallbash_2xa7_rgba
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 0, 80
    halign = center
    valign = center
}
# Current time (minute)
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:150] /home/Lynchalot/.local/bin/lock-glitch M
    color = $wallbash_2xa9_rgba
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 0, -120
    halign = center
    valign = center
}
# Date
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:1000] echo "<b><big> $(date +"%d %b") </big></b>"
    color = $wallbash_2xa8_rgba
    font_size = 20
    font_family = $fontFamily Medium 10
    position = 0, -230
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}
# Day
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:1000] echo "<b><big> $(date +"%A") </big></b>"
    color = $wallbash_2xa8_rgba
    font_size = 20
    font_family = $fontFamily Medium 10
    position = 0, -250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}

# Quote (bottom center, above input)
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:3600000] echo "<i>$(cat $HOME/.cache/splash/quote.txt 2>/dev/null)</i>"
    color = $wallbash_2xa8_rgba
    font_size = 16
    font_family = $fontFamily Italic
    position = 0, 18%
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.7)
    shadow_boost = 1.2
}

#INPUT FIELD
input-field {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 1.00
    dots_center = true
    outer_color = $wallbash_pry2_rgba
    inner_color = $wallbash_pry3_rgba
    font_color = $color7
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    capslock_color = rgba(255, 154, 74, 1.0)
    hide_input = false
    position = 0, 60
    halign = center
    valign = bottom
}

# Battery Status if present
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:5000] $BATTERY_ICON
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -1%, 1%
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}

# Current Keyboard Layout
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = $LAYOUT
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = $fontFamily
    position = -2%, 1%
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}

# ── Media player (left of the clock) ──
# Album art: hyprlock polls lock-info every 2 s and reloads when the path changes; transparent
# placeholder when nothing is playing
image {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    path = /home/Lynchalot/.cache/rice-lock/none.png
    size = 160
    rounding = 18
    border_size = 0
    reload_time = 2
    reload_cmd = /home/Lynchalot/.local/bin/lock-info art
    position = -1100, 70
    halign = center
    valign = center
}
# Artist · title (empty when nothing is playing)
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:2000] /home/Lynchalot/.local/bin/lock-info np
    color = $wallbash_2xa8_rgba
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -1100, -55
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}
# Previous / play-pause / next: click them, or use the media keys or Super+Ctrl+Z/X/C
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:1000] /home/Lynchalot/.local/bin/lock-info btn prev
    onclick = /home/Lynchalot/.local/bin/rice-media previous
    color = $wallbash_2xa9_rgba
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = -1170, -110
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:1000] /home/Lynchalot/.local/bin/lock-info btn play
    onclick = /home/Lynchalot/.local/bin/rice-media play-pause
    color = $wallbash_2xa9_rgba
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = -1100, -110
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:1000] /home/Lynchalot/.local/bin/lock-info btn next
    onclick = /home/Lynchalot/.local/bin/rice-media next
    color = $wallbash_2xa9_rgba
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = -1030, -110
    halign = center
    valign = center
}

# Waiting notifications (top right); hidden when there are none
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:5000] /home/Lynchalot/.local/bin/lock-info notif
    color = $wallbash_2xa8_rgba
    font_size = 13
    font_family = $hudFont
    position = -58, -43
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}

# Caps Lock warning above the password field; only while Caps Lock is on
label {
    monitor =
    zindex = 1   # above the wallpaper (zindex 0); see header
    text = cmd[update:500] /home/Lynchalot/.local/bin/lock-info caps
    color = rgba(255, 154, 74, 1.0)
    font_size = 12
    font_family = $hudFont
    position = 0, 122
    halign = center
    valign = bottom
}
