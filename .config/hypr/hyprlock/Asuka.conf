#  Asuka — custom hyprlock layout (IBM Plex base + weather + quote + text shadows)

$fontFamily = IBM Plex Sans
$resolve.font=IBM Plex Sans|https://github.com/IBM/plex/releases/download/%40ibm%2Fplex-sans%401.1.0/ibm-plex-sans.zip

# GENERAL
background {
    monitor =
    path = $BACKGROUND_PATH
    blur_size = 5
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Weather (top center)
label {
    monitor =
    text = cmd[update:1800000] $WEATHER_CMD
    color = $wallbash_2xa8_rgba
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}

# Current time (hour)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $wallbash_2xa7_rgba
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 0, 80
    halign = center
    valign = center
}
# Current time (minute)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $wallbash_2xa9_rgba
    font_size = 180
    font_family = $fontFamily Medium 10
    position = 0, -120
    halign = center
    valign = center
}
# Date
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%d %b") </big></b>"
    color = $wallbash_2xa8_rgba
    font_size = 20
    font_family = $fontFamily Medium 10
    position = 0, -230
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}
# Day
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%A") </big></b>"
    color = $wallbash_2xa8_rgba
    font_size = 20
    font_family = $fontFamily Medium 10
    position = 0, -250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
    shadow_boost = 1.2
}

# Quote (bottom center, above input)
label {
    monitor =
    text = cmd[update:3600000] echo "<i>$(cat $HOME/.cache/splash/quote.txt 2>/dev/null)</i>"
    color = $wallbash_2xa8_rgba
    font_size = 16
    font_family = $fontFamily Italic
    position = 0, 18%
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.7)
    shadow_boost = 1.2
}

#INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 1.00
    dots_center = true
    outer_color = $wallbash_pry2_rgba
    inner_color = $wallbash_pry3_rgba
    font_color = $color7
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 60
    halign = center
    valign = bottom
}

# Battery Status if present
label {
    monitor =
    text = cmd[update:5000] $BATTERY_ICON
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -1%, 1%
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}

# Current Keyboard Layout
label {
    monitor =
    text = $LAYOUT
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = $fontFamily
    position = -2%, 1%
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 1.5
    shadow_color = rgba(0,0,0,0.6)
}
