

$GTK_THEME=Kanagawa
$ICON_THEME = Tela-circle-nord-dark
$COLOR_SCHEME = prefer-dark
$CURSOR_THEME=Bibata-Modern-Ice
$COLOR_SCHEME=prefer-dark
$FONT=Sarasa Gothic J Nerd Font Regular


general {
    gaps_in = 6
    gaps_out = 12
    border_size = 3
    col.active_border = rgba(78c6ebff) rgba(8289a3ff) 45deg
    col.inactive_border = rgba(7, 15, 42, 0.58)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6

    blur {
        enabled = yes
        size = 4
        passes = 2
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

blurls = waybar
